name: terraform

on:
  pull_request:
    branches: [main]
    paths:
      - "envs/**"
      - "modules/**"
      - ".tflint.hcl"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "envs/**"
      - "modules/**"
      - ".tflint.hcl"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never run two Terraform jobs against dev at the same time
concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.6"
  AWS_REGION: us-east-1

jobs:
  lint:
    name: fmt / tflint / checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - uses: terraform-linters/setup-tflint@v4

      - name: tflint
        run: |
          tflint --init --config "$(pwd)/.tflint.hcl"
          tflint --recursive --config "$(pwd)/.tflint.hcl" --format compact

      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: true # report-only for now; we'll triage the findings, then enforce

  plan:
    name: plan (dev)
    if: github.event_name == 'pull_request'
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC
      pull-requests: write # to post the plan comment
    defaults:
      run:
        working-directory: envs/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate -no-color

      - name: terraform plan
        id: plan
        run: terraform plan -no-color -input=false -lock-timeout=60s | tee plan.txt

      - name: Comment plan on PR
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v7
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- shipyard-plan-dev -->';
            const path = 'envs/dev/plan.txt';
            let plan = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'plan.txt not found, check the job logs';
            const max = 60000;
            if (plan.length > max) plan = '...(truncated, see job logs)\n' + plan.slice(-max);
            const summary = (plan.match(/Plan: .*|No changes\..*/) || ['See job logs'])[0];
            const ok = process.env.PLAN_OUTCOME === 'success';
            const body = [
              marker,
              `### ${ok ? '✅' : '❌'} Terraform plan: \`envs/dev\``,
              `**${summary}**`,
              '',
              '<details><summary>Show full plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '</details>',
              '',
              `_Commit ${context.sha.substring(0, 7)} · triggered by @${context.actor}_`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  apply:
    name: apply (dev)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: lint
    runs-on: ubuntu-latest
    environment: dev # pauses here until you approve
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: envs/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: terraform init -input=false

      - name: terraform plan
        run: terraform plan -no-color -input=false -lock-timeout=60s -out=tfplan

      - name: terraform apply
        run: terraform apply -no-color -input=false tfplan